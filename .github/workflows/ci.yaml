
name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
    quality-and-test:
        runs-on: ubuntu-latest
        env:
            COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
            COINGECKO_BASE_URL: https://api.coingecko.com/api/v3
            DEFAULT_CURRENCY: usd
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Install uv
              uses: astral-sh/setup-uv@v4
              with:
                enable-cache: true
                python-version: "3.12"

            - name: Install dependencies
              run: |
                uv sync --frozen

            - name: Check
              run: make check # runs ruff, mypy and pytest (tests)

    docker-build-check:
        needs: quality-and-test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build Docker image
              run: docker build --no-cache -t crypto-mcp:${{ github.sha }} .